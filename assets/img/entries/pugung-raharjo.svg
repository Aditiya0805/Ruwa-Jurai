<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="pugbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#183326"/>
      <stop offset="100%" stop-color="#0d1b14"/>
    </linearGradient>
    <radialGradient id="pugglow" cx="52%" cy="42%" r="58%">
