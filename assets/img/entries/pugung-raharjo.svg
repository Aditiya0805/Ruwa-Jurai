      <stop offset="100%" stop-color="#48121d"/>
    </linearGradient>
    <pattern id="pugtapis" width="48" height="48" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <path d="M24 3 45 24 24 45 3 24Z" fill="none" stroke="#d9a94f" stroke-width="1"/>
