<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="nyabg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#172d26"/>
      <stop offset="100%" stop-color="#0d1a16"/>
    </linearGradient>
    <radialGradient id="nyaglow" cx="52%" cy="42%" r="58%">
      <stop offset="0%" stop-color="#e6b868" stop-opacity="0.48"/>
      <stop offset="55%" stop-color="#e6b868" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#e6b868" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="nyagold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fae6b4"/>
      <stop offset="45%" stop-color="#d9a94f"/>
      <stop offset="100%" stop-color="#9e6d24"/>
    </linearGradient>
    <linearGradient id="nyamaroon" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8a2b3d"/>
      <stop offset="100%" stop-color="#48121d"/>
    </linearGradient>
    <pattern id="nyatapis" width="48" height="48" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <path d="M24 3 45 24 24 45 3 24Z" fill="none" stroke="#d9a94f" stroke-width="1"/>
      <path d="M24 12 36 24 24 36 12 24Z" fill="none" stroke="#d9a94f" stroke-width="0.7" opacity="0.6"/>
      <circle cx="24" cy="24" r="1.5" fill="#d9a94f"/>
    </pattern>
    <filter id="nyashadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0a0605" flood-opacity="0.45"/>
    </filter>
  </defs>
  <rect width="800" height="600" fill="url(#nyabg)"/>
  <rect width="800" height="600" fill="url(#nyatapis)" opacity="0.09"/>
