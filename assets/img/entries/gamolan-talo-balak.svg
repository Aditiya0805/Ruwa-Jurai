<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="gambg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#182c24"/>
      <stop offset="100%" stop-color="#0e1a15"/>
    </linearGradient>
    <radialGradient id="gamglow" cx="52%" cy="42%" r="58%">
      <stop offset="0%" stop-color="#e2b25c" stop-opacity="0.48"/>
      <stop offset="55%" stop-color="#e2b25c" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#e2b25c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gamgold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fae6b4"/>
      <stop offset="45%" stop-color="#d9a94f"/>
      <stop offset="100%" stop-color="#9e6d24"/>
    </linearGradient>
    <linearGradient id="gammaroon" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8a2b3d"/>
      <stop offset="100%" stop-color="#48121d"/>
    </linearGradient>
    <pattern id="gamtapis" width="48" height="48" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <path d="M24 3 45 24 24 45 3 24Z" fill="none" stroke="#d9a94f" stroke-width="1"/>
      <path d="M24 12 36 24 24 36 12 24Z" fill="none" stroke="#d9a94f" stroke-width="0.7" opacity="0.6"/>
      <circle cx="24" cy="24" r="1.5" fill="#d9a94f"/>
    </pattern>
    <filter id="gamshadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0a0605" flood-opacity="0.45"/>
    </filter>
  </defs>
  <rect width="800" height="600" fill="url(#gambg)"/>
  <rect width="800" height="600" fill="url(#gamtapis)" opacity="0.09"/>
  <rect width="800" height="600" fill="url(#gamglow)"/>
  
        <g filter="url(#gamshadow)">
          <!-- Wooden Talo Balak gong rack -->
          <g transform="translate(460 250)">
            <rect x="-195" y="-125" width="390" height="22" rx="6" fill="#4f2918" stroke="#d9a94f" stroke-width="2"/>
            <rect x="-175" y="-105" width="22" height="270" rx="4" fill="#3b1d10" stroke="#9e6d24" stroke-width="1.5"/>
            <rect x="153" y="-105" width="22" height="270" rx="4" fill="#3b1d10" stroke="#9e6d24" stroke-width="1.5"/>
            <!-- Large bossed brass gong -->
            <path d="M-45 -103 L-32 -65 M45 -103 L32 -65" stroke="#d9a94f" stroke-width="3"/>
            <circle cx="0" cy="22" r="95" fill="url(#gamgold)" stroke="#623c10" stroke-width="3"/>
            <circle cx="0" cy="22" r="74" fill="none" stroke="#7d4f18" stroke-width="2"/>
            <circle cx="0" cy="22" r="28" fill="#fae6b4" stroke="#623c10" stroke-width="2.5"/>
            <!-- Small gong ketuk -->
            <circle cx="-112" cy="36" r="42" fill="url(#gamgold)" stroke="#623c10" stroke-width="2"/>
            <circle cx="-112" cy="36" r="14" fill="#fae6b4"/>
            <circle cx="112" cy="36" r="42" fill="url(#gamgold)" stroke="#623c10" stroke-width="2"/>
            <circle cx="112" cy="36" r="14" fill="#fae6b4"/>
            <!-- Sound waves -->
            <circle cx="0" cy="22" r="122" fill="none" stroke="#fae6b4" stroke-width="1" stroke-dasharray="4 6" opacity="0.45"/>
          </g>
          <!-- Bamboo Gamolan Pekhing foreground -->
          <g transform="translate(260 445) rotate(-5)">
            <path d="M-195 30 L195 30 L175 78 L-175 78 Z" fill="#3d1e12" stroke="#d9a94f" stroke-width="2"/>
            <g fill="#d5a65c" stroke="#7b511c" stroke-width="1.8">
              <rect x="-170" y="-12" width="32" height="58" rx="6"/>
              <rect x="-126" y="-8" width="32" height="54" rx="6"/>
              <rect x="-82" y="-4" width="32" height="50" rx="6"/>
              <rect x="-38" y="0" width="32" height="46" rx="6"/>
              <rect x="6" y="4" width="32" height="42" rx="6"/>
              <rect x="50" y="8" width="32" height="38" rx="6"/>
              <rect x="94" y="12" width="32" height="34" rx="6"/>
              <rect x="138" y="15" width="30" height="31" rx="6"/>
            </g>
            <!-- Wooden mallets -->
            <path d="M-110 -45 L-35 2" stroke="#fae6b4" stroke-width="5" stroke-linecap="round"/>
            <circle cx="-32" cy="4" r="10" fill="#8a2b3d" stroke="#d9a94f" stroke-width="2"/>
            <path d="M120 -35 L55 12" stroke="#fae6b4" stroke-width="5" stroke-linecap="round"/>
            <circle cx="52" cy="14" r="10" fill="#8a2b3d" stroke="#d9a94f" stroke-width="2"/>
          </g>
        </g>
        
  <rect x="20" y="20" width="760" height="560" rx="14" fill="none" stroke="#d9a94f" stroke-opacity="0.24" stroke-width="1.2"/>
  <path d="M20 52 L52 20 M748 20 L780 52 M20 548 L52 580 M748 580 L780 548" stroke="#d9a94f" stroke-opacity="0.35" stroke-width="1.5"/>
</svg>