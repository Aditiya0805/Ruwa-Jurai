<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="ngabg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3e1920"/>
      <stop offset="100%" stop-color="#1f0e11"/>
    </linearGradient>
    <radialGradient id="ngaglow" cx="52%" cy="42%" r="58%">
      <stop offset="0%" stop-color="#e5b45d" stop-opacity="0.48"/>
      <stop offset="55%" stop-color="#e5b45d" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#e5b45d" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ngagold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fae6b4"/>
      <stop offset="45%" stop-color="#d9a94f"/>
      <stop offset="100%" stop-color="#9e6d24"/>
    </linearGradient>
    <linearGradient id="ngamaroon" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8a2b3d"/>
      <stop offset="100%" stop-color="#48121d"/>
    </linearGradient>
    <pattern id="ngatapis" width="48" height="48" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <path d="M24 3 45 24 24 45 3 24Z" fill="none" stroke="#d9a94f" stroke-width="1"/>
      <path d="M24 12 36 24 24 36 12 24Z" fill="none" stroke="#d9a94f" stroke-width="0.7" opacity="0.6"/>
      <circle cx="24" cy="24" r="1.5" fill="#d9a94f"/>
    </pattern>
    <filter id="ngashadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0a0605" flood-opacity="0.45"/>
    </filter>
  </defs>
  <rect width="800" height="600" fill="url(#ngabg)"/>
  <rect width="800" height="600" fill="url(#ngatapis)" opacity="0.09"/>
  <rect width="800" height="600" fill="url(#ngaglow)"/>
  
        <!-- Feast table runner -->
        <rect x="65" y="340" width="670" height="200" rx="22" fill="#2e1815" stroke="#d9a94f" stroke-opacity="0.35"/>
        <rect x="110" y="365" width="580" height="150" rx="12" fill="url(#ngamaroon)" stroke="#d9a94f" stroke-width="2"/>
        <g filter="url(#ngashadow)">
          <!-- Center ornate Dulang with Tudung Saji dome -->
          <g transform="translate(400 325)">
            <ellipse cx="0" cy="60" rx="155" ry="44" fill="url(#ngagold)" stroke="#6c4514" stroke-width="2.5"/>
            <ellipse cx="0" cy="54" rx="135" ry="34" fill="#fdf1d8"/>
            <path d="M-125 52 Q-115 -88 0 -102 Q115 -88 125 52 Z" fill="#8a2b3d" stroke="url(#ngagold)" stroke-width="3"/>
            <path d="M-100 50 Q-85 -62 0 -75 Q85 -62 100 50" fill="none" stroke="#fae6b4" stroke-width="2.5" stroke-dasharray="6 4"/>
            <path d="M-65 50 Q-50 -38 0 -48 Q50 -38 65 50" fill="none" stroke="#d9a94f" stroke-width="2"/>
            <circle cx="0" cy="-108" r="14" fill="url(#ngagold)" stroke="#6c4514" stroke-width="2"/>
          </g>
          <!-- Left brass bowl & cups -->
          <g transform="translate(195 405)">
            <ellipse cx="0" cy="24" rx="68" ry="24" fill="url(#ngagold)" stroke="#6c4514" stroke-width="2"/>
            <ellipse cx="0" cy="18" rx="54" ry="16" fill="#d3963d"/>
            <circle cx="0" cy="-10" r="18" fill="#f5efe2" stroke="#b98635" stroke-width="2"/>
          </g>
          <!-- Right brass bowl & teapot -->
          <g transform="translate(605 400)">
            <ellipse cx="0" cy="28" rx="65" ry="22" fill="url(#ngagold)" stroke="#6c4514" stroke-width="2"/>
            <path d="M-26 20 Q-32 -28 0 -38 Q32 -28 26 20 Z" fill="url(#ngagold)" stroke="#6c4514" stroke-width="2"/>
            <path d="M24 -12 Q52 -24 44 6 Q38 18 24 14" fill="none" stroke="#d9a94f" stroke-width="5"/>
            <path d="M-24 -5 L-48 -24" stroke="#d9a94f" stroke-width="6" stroke-linecap="round"/>
          </g>
        </g>
        
  <rect x="20" y="20" width="760" height="560" rx="14" fill="none" stroke="#d9a94f" stroke-opacity="0.24" stroke-width="1.2"/>
  <path d="M20 52 L52 20 M748 20 L780 52 M20 548 L52 580 M748 580 L780 548" stroke="#d9a94f" stroke-opacity="0.35" stroke-width="1.5"/>
</svg>