<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="diabg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#162d26"/>
      <stop offset="100%" stop-color="#2c191c"/>
    </linearGradient>
    <radialGradient id="diaglow" cx="52%" cy="42%" r="58%">
      <stop offset="0%" stop-color="#d9a94f" stop-opacity="0.48"/>
      <stop offset="55%" stop-color="#d9a94f" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#d9a94f" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="diagold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fae6b4"/>
      <stop offset="45%" stop-color="#d9a94f"/>
      <stop offset="100%" stop-color="#9e6d24"/>
    </linearGradient>
    <linearGradient id="diamaroon" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8a2b3d"/>
      <stop offset="100%" stop-color="#48121d"/>
    </linearGradient>
    <pattern id="diatapis" width="48" height="48" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <path d="M24 3 45 24 24 45 3 24Z" fill="none" stroke="#d9a94f" stroke-width="1"/>
      <path d="M24 12 36 24 24 36 12 24Z" fill="none" stroke="#d9a94f" stroke-width="0.7" opacity="0.6"/>
      <circle cx="24" cy="24" r="1.5" fill="#d9a94f"/>
    </pattern>
    <filter id="diashadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0a0605" flood-opacity="0.45"/>
    </filter>
  </defs>
  <rect width="800" height="600" fill="url(#diabg)"/>
  <rect width="800" height="600" fill="url(#diatapis)" opacity="0.09"/>
  <rect width="800" height="600" fill="url(#diaglow)"/>
  
        <!-- Split landscape: Left sea (Api) · Right highlands (Nyow) -->
        <path d="M400 80 V520" stroke="#d9a94f" stroke-width="1.5" stroke-dasharray="5 7" opacity="0.5"/>
        <!-- Left ocean & sun -->
        <circle cx="215" cy="185" r="56" fill="url(#diagold)" opacity="0.35"/>
        <path d="M50 400 Q135 375 220 400 T390 400 V540 H50 Z" fill="#17443c" opacity="0.7"/>
        <path d="M60 445 q35-14 70 0 t70 0 70 0 70 0" fill="none" stroke="#8cb9ab" stroke-width="2.5" opacity="0.6"/>
        <!-- Right highlands & village roof -->
        <path d="M410 410 L540 275 L650 375 L745 295 V540 H410 Z" fill="#3f1e26" opacity="0.75"/>
        <!-- Interlocking voice waves -->
        <g fill="none" stroke="url(#diagold)" stroke-width="3" opacity="0.85">
          <circle cx="400" cy="300" r="65" stroke-dasharray="8 6"/>
          <circle cx="400" cy="300" r="108" opacity="0.5"/>
          <circle cx="400" cy="300" r="154" stroke-dasharray="3 9" opacity="0.35"/>
        </g>
        <!-- Speech badges with Aksara -->
        <g filter="url(#diashadow)">
          <rect x="115" y="195" width="190" height="120" rx="22" fill="#163a2f" stroke="url(#diagold)" stroke-width="2.5"/>
          <rect x="495" y="195" width="190" height="120" rx="22" fill="#6a1c2b" stroke="url(#diagold)" stroke-width="2.5"/>
          <g fill="none" stroke="#fae6b4" stroke-width="7.5" stroke-linecap="round" stroke-linejoin="round">
<g transform="translate(150 235) scale(0.62)"><path d="M23 84 L46 22 Q50 13 54 22 L58 38 Q61 46 65 38 L74 16"/><path d="M36 54 L52 84"/></g>
<g transform="translate(212 235) scale(0.62)"><path d="M32 50 Q24 78 34 83 Q43 87 51 76 L77 16"/><path d="M50 0 Q57 10 64 0"/></g>
</g>
          <g fill="none" stroke="#fae6b4" stroke-width="7.5" stroke-linecap="round" stroke-linejoin="round">
<g transform="translate(525 235) scale(0.62)"><path d="M24 84 L46 18"/><path d="M38 46 Q45 28 52 34 Q57 40 56 68 Q56 84 65 81 Q72 78 74 66"/><path d="M38 92 L38 106"/></g>
<g transform="translate(587 235) scale(0.62)"><path d="M22 84 L62 22 Q67 14 68 26 L60 58"/><path d="M46 84 L76 44"/></g>
</g>
