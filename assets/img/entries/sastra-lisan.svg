<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="sasbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#271814"/>
      <stop offset="100%" stop-color="#120c0a"/>
    </linearGradient>
    <radialGradient id="sasglow" cx="52%" cy="42%" r="58%">
      <stop offset="0%" stop-color="#f0ba60" stop-opacity="0.48"/>
      <stop offset="55%" stop-color="#f0ba60" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#f0ba60" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sasgold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fae6b4"/>
      <stop offset="45%" stop-color="#d9a94f"/>
      <stop offset="100%" stop-color="#9e6d24"/>
    </linearGradient>
    <linearGradient id="sasmaroon" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8a2b3d"/>
      <stop offset="100%" stop-color="#48121d"/>
    </linearGradient>
    <pattern id="sastapis" width="48" height="48" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <path d="M24 3 45 24 24 45 3 24Z" fill="none" stroke="#d9a94f" stroke-width="1"/>
      <path d="M24 12 36 24 24 36 12 24Z" fill="none" stroke="#d9a94f" stroke-width="0.7" opacity="0.6"/>
      <circle cx="24" cy="24" r="1.5" fill="#d9a94f"/>
    </pattern>
    <filter id="sasshadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0a0605" flood-opacity="0.45"/>
    </filter>
  </defs>
  <rect width="800" height="600" fill="url(#sasbg)"/>
  <rect width="800" height="600" fill="url(#sastapis)" opacity="0.09"/>
  <rect width="800" height="600" fill="url(#sasglow)"/>
  
        <!-- Warm lantern glow halo -->
        <circle cx="515" cy="340" r="190" fill="#f3c66b" opacity="0.16"/>
        <circle cx="515" cy="340" r="120" fill="#f3c66b" opacity="0.18"/>
        <g filter="url(#sasshadow)">
          <!-- Brass Pelita oil lamp -->
          <g transform="translate(525 405)">
            <ellipse cx="0" cy="70" rx="68" ry="16" fill="url(#sasgold)" stroke="#623c10" stroke-width="2"/>
            <path d="M-14 70 L-8 10 H8 L14 70 Z" fill="url(#sasgold)"/>
            <ellipse cx="0" cy="6" rx="58" ry="18" fill="url(#sasgold)" stroke="#623c10" stroke-width="2"/>
            <!-- Flame -->
            <path d="M0 -8 C-16 -32 -12 -65 0 -86 C12 -65 16 -32 0 -8 Z" fill="#fae6b4"/>
            <path d="M0 -12 C-8 -28 -6 -48 0 -62 C6 -48 8 -28 0 -12 Z" fill="#fffaf0"/>
          </g>
          <!-- Storyteller & acoustic rhythm arcs -->
          <g transform="translate(245 360)">
            <circle cx="0" cy="-95" r="28" fill="#dba97d"/>
            <path d="M-28 -115 Q0 -142 28 -115 Z" fill="#2a1d17" stroke="#d9a94f" stroke-width="2"/>
            <path d="M-45 -58 Q0 -75 45 -58 L72 115 H-72 Z" fill="url(#sasmaroon)" stroke="#d9a94f" stroke-width="2.5"/>
            <path d="M35 -35 Q78 -15 95 25" fill="none" stroke="#dba97d" stroke-width="11" stroke-linecap="round"/>
          </g>
          <!-- Flowing poetic sound waves & aksara accents -->
          <g fill="none" stroke="#fae6b4" stroke-linecap="round" opacity="0.55">
            <path d="M320 215 Q395 165 470 215 T620 205" stroke-width="2.5"/>
            <path d="M340 175 Q415 128 490 175 T640 165" stroke-width="1.8" stroke-dasharray="6 6"/>
            <path d="M360 135 Q435 90 510 135 T660 125" stroke-width="1.2"/>
