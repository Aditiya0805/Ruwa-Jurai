<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="kerbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#36181f"/>
      <stop offset="100%" stop-color="#1a0d10"/>
    </linearGradient>
    <radialGradient id="kerglow" cx="52%" cy="42%" r="58%">
      <stop offset="0%" stop-color="#d9a94f" stop-opacity="0.48"/>
      <stop offset="55%" stop-color="#d9a94f" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#d9a94f" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="kergold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fae6b4"/>
      <stop offset="45%" stop-color="#d9a94f"/>
      <stop offset="100%" stop-color="#9e6d24"/>
    </linearGradient>
    <linearGradient id="kermaroon" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8a2b3d"/>
      <stop offset="100%" stop-color="#48121d"/>
    </linearGradient>
    <pattern id="kertapis" width="48" height="48" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <path d="M24 3 45 24 24 45 3 24Z" fill="none" stroke="#d9a94f" stroke-width="1"/>
      <path d="M24 12 36 24 24 36 12 24Z" fill="none" stroke="#d9a94f" stroke-width="0.7" opacity="0.6"/>
      <circle cx="24" cy="24" r="1.5" fill="#d9a94f"/>
    </pattern>
    <filter id="kershadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0a0605" flood-opacity="0.45"/>
    </filter>
  </defs>
  <rect width="800" height="600" fill="url(#kerbg)"/>
  <rect width="800" height="600" fill="url(#kertapis)" opacity="0.09"/>
  <rect width="800" height="600" fill="url(#kerglow)"/>
  
        <g filter="url(#kershadow)">
          <!-- Wooden weaving loom frame -->
          <rect x="130" y="95" width="380" height="24" rx="6" fill="#4f2918" stroke="#d9a94f" stroke-width="2"/>
          <rect x="130" y="425" width="380" height="24" rx="6" fill="#4f2918" stroke="#d9a94f" stroke-width="2"/>
          <rect x="148" y="115" width="20" height="314" fill="#3b1d10"/>
          <rect x="472" y="115" width="20" height="314" fill="#3b1d10"/>
          <!-- Maroon & gold tapis woven cloth on loom -->
          <rect x="180" y="120" width="280" height="305" fill="url(#kermaroon)"/>
          <g stroke="#d9a94f" stroke-width="1.5" opacity="0.55">
            <line x1="205" y1="120" x2="205" y2="425"/><line x1="245" y1="120" x2="245" y2="425"/>
            <line x1="285" y1="120" x2="285" y2="425"/><line x1="325" y1="120" x2="325" y2="425"/>
            <line x1="365" y1="120" x2="365" y2="425"/><line x1="405" y1="120" x2="405" y2="425"/>
            <line x1="440" y1="120" x2="440" y2="425"/>
          </g>
          <!-- Gold pucuk rebung woven across center -->
          <path d="M180 285 L220 215 L260 285 L300 215 L340 285 L380 215 L420 285 L460 215 L460 325 H180 Z" fill="url(#kergold)" opacity="0.9"/>
          <!-- Wooden weaving shuttle -->
          <g transform="translate(360 355) rotate(-14)">
            <path d="M-115 0 Q0 -26 115 0 Q0 26 -115 0 Z" fill="#6b3e1f" stroke="#fae6b4" stroke-width="2"/>
            <rect x="-32" y="-8" width="64" height="16" rx="4" fill="#fae6b4"/>
          </g>
          <!-- Woven bamboo basketry right -->
          <g transform="translate(605 405)">
            <path d="M-85 -35 H85 L68 78 Q0 96 -68 78 Z" fill="#c7954f" stroke="#623c10" stroke-width="2.5"/>
            <ellipse cx="0" cy="-35" rx="85" ry="22" fill="#e5bf7a" stroke="#623c10" stroke-width="2.5"/>
            <ellipse cx="0" cy="-35" rx="68" ry="14" fill="#3a2016"/>
            <path d="M-72 0 L-36 38 L0 0 L36 38 L72 0" fill="none" stroke="#6a1c2b" stroke-width="5"/>
          </g>
        </g>
        
  <rect x="20" y="20" width="760" height="560" rx="14" fill="none" stroke="#d9a94f" stroke-opacity="0.24" stroke-width="1.2"/>
  <path d="M20 52 L52 20 M748 20 L780 52 M20 548 L52 580 M748 580 L780 548" stroke="#d9a94f" stroke-opacity="0.35" stroke-width="1.5"/>
</svg>