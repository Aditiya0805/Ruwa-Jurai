<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="sebbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2c1b18"/>
      <stop offset="100%" stop-color="#18100e"/>
    </linearGradient>
    <radialGradient id="sebglow" cx="52%" cy="42%" r="58%">
      <stop offset="0%" stop-color="#d9a94f" stop-opacity="0.48"/>
      <stop offset="55%" stop-color="#d9a94f" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#d9a94f" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sebgold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fae6b4"/>
      <stop offset="45%" stop-color="#d9a94f"/>
      <stop offset="100%" stop-color="#9e6d24"/>
    </linearGradient>
    <linearGradient id="sebmaroon" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8a2b3d"/>
      <stop offset="100%" stop-color="#48121d"/>
    </linearGradient>
    <pattern id="sebtapis" width="48" height="48" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <path d="M24 3 45 24 24 45 3 24Z" fill="none" stroke="#d9a94f" stroke-width="1"/>
      <path d="M24 12 36 24 24 36 12 24Z" fill="none" stroke="#d9a94f" stroke-width="0.7" opacity="0.6"/>
      <circle cx="24" cy="24" r="1.5" fill="#d9a94f"/>
    </pattern>
    <filter id="sebshadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0a0605" flood-opacity="0.45"/>
    </filter>
  </defs>
  <rect width="800" height="600" fill="url(#sebbg)"/>
  <rect width="800" height="600" fill="url(#sebtapis)" opacity="0.09"/>
  <rect width="800" height="600" fill="url(#sebglow)"/>
  
        <!-- Woven pandan mat background table -->
        <rect x="80" y="340" width="640" height="210" rx="18" fill="#4e3926" stroke="#d9a94f" stroke-opacity="0.35" stroke-width="2"/>
        <!-- Folded Tapis fabric -->
        <g filter="url(#sebshadow)">
          <path d="M130 370 L390 320 L480 410 L210 475 Z" fill="url(#sebmaroon)" stroke="#d9a94f" stroke-width="2.5"/>
          <path d="M165 390 L380 348 L435 402 L220 448 Z" fill="none" stroke="#fae6b4" stroke-width="2" stroke-dasharray="6 4"/>
          <!-- Folded Tenepik parchment letter -->
          <g transform="translate(300 285) rotate(-8)">
            <rect x="0" y="0" width="215" height="145" rx="8" fill="#f6ebd3" stroke="#b98635" stroke-width="2.5"/>
            <path d="M0 10 L107.5 85 L215 10" fill="none" stroke="#c59753" stroke-width="2"/>
            <!-- Crimson silk cord & seal -->
            <path d="M107.5 0 V145" stroke="#8a2b3d" stroke-width="7"/>
            <circle cx="107.5" cy="76" r="18" fill="#8a2b3d" stroke="url(#sebgold)" stroke-width="2.5"/>
            <path d="M100 76 L107.5 67 L115 76 L107.5 85 Z" fill="#fae6b4"/>
          </g>
          <!-- Ornate brass Tepak Sirih -->
          <g transform="translate(555 375)">
            <ellipse cx="0" cy="48" rx="92" ry="24" fill="#2d1a0d" opacity="0.5"/>
            <path d="M-82 0 H82 L68 48 H-68 Z" fill="url(#sebgold)" stroke="#684312" stroke-width="2"/>
            <path d="M-90 -18 L-70 -35 H70 L90 -18 L82 0 H-82 Z" fill="#f3d691" stroke="#684312" stroke-width="2"/>
            <path d="M-45 -18 H45 M-50 22 H50" stroke="#7c5218" stroke-width="2"/>
          </g>
          <!-- Betel leaves -->
          <path d="M180 480 C160 440 215 415 240 460 C220 495 190 495 180 480 Z" fill="#3f6b4b" stroke="#22422b" stroke-width="2"/>
          <path d="M225 492 C210 455 262 435 282 478 C264 508 235 508 225 492 Z" fill="#4f805c" stroke="#22422b" stroke-width="2"/>
        </g>
        
  <rect x="20" y="20" width="760" height="560" rx="14" fill="none" stroke="#d9a94f" stroke-opacity="0.24" stroke-width="1.2"/>
  <path d="M20 52 L52 20 M748 20 L780 52 M20 548 L52 580 M748 580 L780 548" stroke="#d9a94f" stroke-opacity="0.35" stroke-width="1.5"/>
</svg>