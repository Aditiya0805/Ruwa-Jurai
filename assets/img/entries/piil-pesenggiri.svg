<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="piilbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#33121a"/>
      <stop offset="100%" stop-color="#1c0d11"/>
    </linearGradient>
    <radialGradient id="piilglow" cx="52%" cy="42%" r="58%">
      <stop offset="0%" stop-color="#d9a94f" stop-opacity="0.48"/>
      <stop offset="55%" stop-color="#d9a94f" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#d9a94f" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="piilgold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fae6b4"/>
      <stop offset="45%" stop-color="#d9a94f"/>
      <stop offset="100%" stop-color="#9e6d24"/>
    </linearGradient>
    <linearGradient id="piilmaroon" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8a2b3d"/>
      <stop offset="100%" stop-color="#48121d"/>
    </linearGradient>
    <pattern id="piiltapis" width="48" height="48" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <path d="M24 3 45 24 24 45 3 24Z" fill="none" stroke="#d9a94f" stroke-width="1"/>
      <path d="M24 12 36 24 24 36 12 24Z" fill="none" stroke="#d9a94f" stroke-width="0.7" opacity="0.6"/>
      <circle cx="24" cy="24" r="1.5" fill="#d9a94f"/>
    </pattern>
    <filter id="piilshadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0a0605" flood-opacity="0.45"/>
    </filter>
  </defs>
  <rect width="800" height="600" fill="url(#piilbg)"/>
  <rect width="800" height="600" fill="url(#piiltapis)" opacity="0.09"/>
  <rect width="800" height="600" fill="url(#piilglow)"/>
  
        <g transform="translate(400 285)" filter="url(#piilshadow)">
          <circle r="215" fill="#281017" stroke="url(#piilgold)" stroke-width="2"/>
          <circle r="192" fill="none" stroke="#d9a94f" stroke-width="1" stroke-dasharray="3 8" opacity="0.6"/>
          <!-- 8-point Lampung star / compass -->
          <path d="M0 -180 L42 -42 L180 0 L42 42 L0 180 L-42 42 L-180 0 L-42 -42 Z" fill="url(#piilmaroon)" stroke="url(#piilgold)" stroke-width="2.5"/>
          <path d="M-112 -112 L-24 -52 L112 -112 L52 -24 L112 112 L24 52 L-112 112 L-52 24 Z" fill="none" stroke="#fae6b4" stroke-width="1.4" opacity="0.65"/>
          <circle r="68" fill="#17382d" stroke="url(#piilgold)" stroke-width="3"/>
          <!-- Musyawarah circle motif inside -->
          <circle cx="0" cy="-28" r="10" fill="#fae6b4"/>
          <circle cx="28" cy="0" r="10" fill="#fae6b4"/>
          <circle cx="0" cy="28" r="10" fill="#fae6b4"/>
          <circle cx="-28" cy="0" r="10" fill="#fae6b4"/>
          <circle r="12" fill="url(#piilgold)"/>
          <!-- 4 pillar nodes -->
          <g fill="#f5efe2" stroke="url(#piilgold)" stroke-width="2">
            <circle cx="0" cy="-180" r="14" fill="#6a1c2b"/>
            <circle cx="180" cy="0" r="14" fill="#1c3a2f"/>
            <circle cx="0" cy="180" r="14" fill="#6a1c2b"/>
            <circle cx="-180" cy="0" r="14" fill="#1c3a2f"/>
          </g>
        </g>
        <!-- Pavilion roof silhouette base -->
        <path d="M120 555 L400 475 L680 555 Z" fill="#190c0f" stroke="#d9a94f" stroke-opacity="0.4" stroke-width="1.5"/>
        <rect x="200" y="555" width="400" height="45" fill="#12080a"/>
        
  <rect x="20" y="20" width="760" height="560" rx="14" fill="none" stroke="#d9a94f" stroke-opacity="0.24" stroke-width="1.2"/>
  <path d="M20 52 L52 20 M748 20 L780 52 M20 548 L52 580 M748 580 L780 548" stroke="#d9a94f" stroke-opacity="0.35" stroke-width="1.5"/>
</svg>